services:
  web:
    build: .
    image: sievers-study-hall:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/prod.db
    ports:
      - "8081:8081"
    volumes:
      - data:/data
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data:
  logs:
