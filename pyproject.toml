[project]
name = "sievers-study-hall"
version = "0.1.0"
description = "Interactive German grammar exercises built with Flask."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Clément Camus", email = "cbjcamus@gmail.com" },
    { name = "dennisblandford", email = "dennisblandford@users.noreply.github.com" },
]
dependencies = [
    "flask>=3.1",
    "flask-login>=0.6",
    "flask-mail>=0.10",
    "flask-migrate>=4.1",
    "flask-sqlalchemy>=3.1",
    "gunicorn>=27.0.1",
    "huggingface-hub~=1.29.0",
    "itsdangerous>=2.2",
    "numpy>=2.2",
    "pandas>=2.2",
    "python-dotenv>=1.1",
    "werkzeug>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
# macOS app-bundle tooling. Not installed by default; use `uv sync --group macos`.
macos = [
    "altgraph>=0.17",
    "macholib>=1.16",
    "modulegraph>=0.19",
    "py2app>=0.28",
]

[tool.uv]
# This is an application, not an installable library: manage its dependencies
# with uv without building/installing the project itself.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
    ".venv",
    "data/datasets",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # long template/data strings
    "B008",  # function calls in argument defaults are intentional
]

[tool.ruff.lint.isort]
known-first-party = ["data", "users", "webapp"]
